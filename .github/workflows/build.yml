name: CI

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - master
      - "releases/*"
      - "feature/*"
  pull_request:
    branches: 
      - master
      - "releases/*"
      - "feature/*"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, linux-x64, osx-x64]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 3.0.100

      - name: Build self-contained for ${{ matrix.runtime }}
        run: |
          cd GhostToGitHubPagesConverter
          dotnet publish --configuration Release --self-contained --runtime ${{ matrix.runtime }} --output artifacts/${{ matrix.runtime }}

      - uses: actions/upload-artifact@master
        with:
          name: Publish artifacts
          path: GhostToGitHubPagesConverter/artifacts

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 3.0.100

      - name: Build
        run: |
          cd GhostToGitHubPagesConverter
          dotnet publish --configuration Release

      - name: Pack
        run: |
          cd GhostToGitHubPagesConverter
          dotnet pack --configuration Release --output artifacts

      - uses: actions/upload-artifact@master
        with:
          name: Publish artifacts
          path: GhostToGitHubPagesConverter/artifacts
